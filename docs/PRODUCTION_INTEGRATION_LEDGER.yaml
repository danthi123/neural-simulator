# PRODUCTION-INTEGRATION LEDGER — the honest state of the DEFAULT /api/brain-chat turn.
#
# THE GOAL (owner, 2026-08-11): a working all-spiking one-substrate brain with ALL faculties ON BY DEFAULT in
# production, fully functional when chatted with. A faculty is DONE only when WIRED + ON-BY-DEFAULT + SCAFFOLD-RETIRED.
# This file is the tracked truth; tools/gates/production_integration.py (CLASS PI) cross-checks every row's levels
# against live source (anchors) and blocks any doc that CLAIMS a faculty is integrated/wired/on-by-default/one-brain
# beyond what its row supports. Seeded 2026-08-11 from workflow wjgvtko3i (12-agent code-trace, adversarially checked).
#
# LEVELS (each a verified value: YES / PARTIAL / NO):
#   de_risked        validated GO at runner/de-risk level (6-seed etc.)
#   wired            reachable from webapp/server.py /api/brain-chat -> the ChatBrain it builds (not only a runner)
#   on_by_default    runs in the DEFAULT config the owner gets (no opt-in flag, not default-off, not behind rich=True)
#   scaffold_retired the host shortcut it replaces is GONE from the default path (deleted / demoted to test-oracle)
# A row is INTEGRATED only when wired=YES AND on_by_default=YES AND scaffold_retired=YES.
#
# retire_status (added 2026-09-02, owner steer: make scaffold-retirement a FIRST-CLASS, gate-BLOCKED state, not a
# thing left ON forever). One enum per row, enforced by CLASS PI Check D:
#   RETIRED                    the host cheat is GONE from the default path (scaffold_retired must be YES).
#   RETIRABLE_NOW <YYYY-MM-DD>  the neural replacement already authors the verdict; only dead/overridden/demoted host
#                              code remains — retire it. Aged > 14 days BLOCKS (the forcing function).
#   BLOCKED:<frontier-row>     host cognition is still in the default path AND its neural replacement is not GO;
#                              <frontier-row> names a REAL ledger row not yet in the production default (de_risked!=YES
#                              OR on_by_default!=YES) that carries the unmet wall. (The shared production-language
#                              frontier is neural-render — the brain speaking its own arbitrary prose; reward/value/
#                              engagement afferents chain to self-model-reward-residual; the cross-turn held-topic
#                              workspace to gnw-thought-swap.)
#   LEGITIMATE                 world / body / clock / initial-education (host TRAINING CURRICULUM / matched-quality
#                              corpus) — EXEMPT, never owes a retirement (owner: a curriculum is not a cheat).
#   ADDITIVE                   no host-COGNITION scaffold in the default path (a substrate-consolidation co-residency
#                              gap or a permanent additive config bound is not a cheat) — a valid terminal state.
# NOTE (taxonomy correction, this landing): 7 rows a draft taxonomy called host=(none)/RETIRABLE_NOW — episodic-memory,
# wm-binding-advanced, noncontradiction-gate, reconsolidation, tiered-knowledge-ltm, da-gated-encoding,
# da-gated-curiosity-threshold — were verified against SOURCE and each still carries real declared host residuals, so
# they are BLOCKED, NOT retirable. one-brain-substrate was RETIRED (proof retirement). CORRECTED 2026-09-03 (Wall-2
# scaffold-retirement audit): this landing's own "genuine RETIRABLE_NOW pool is gnw-bus-shadow (+ gnw-two/three-organ-
# bus, which share its gate_via_bus dead-code follow-on)" claim was ITSELF stale — checked against SOURCE, gnw-bus-
# shadow's gate_via_bus follow-on was already BUILT AND COMMITTED same-day 2026-08-13 (6ab22eb55, finding
# 2026-08-13-gnw-bus-scaffold-retirement-SCOPED.md), and gnw-two/three-organ-bus were each BUILT with the identical
# never-compute-the-host-combination pattern from their own inception (their own docstrings: "mirroring
# gnw_bus_shadow.gate_via_bus's routing EXACTLY") — none of the three was ever in the "computed-then-overridden"
# state RETIRABLE_NOW describes, so there was no dead-code follow-on left to build. Live-verified this HEAD:
# research/findings/raw/_gnw_bus_family_ledger_correction/verify.json (GO). All three now read
# scaffold_retired:PARTIAL / retire_status:BLOCKED:neural-render (the SAME shape as content-selection's own
# PARTIAL residual — host QuestionRouter kept, correctly, for the out-of-scope classes the bus never claimed).
#
# ANCHORS (the machine-checkable part). default_anchor: the gate reads the RHS literal at `assign` and derives the
# expected value FROM the on_by_default LEVEL (NO => must be off_value; YES => must be on_value). scaffold_symbol: while
# scaffold_retired=NO the host symbol MUST be present; =YES it must be absent. If source flips without the ledger moving
# (or the ledger flips without the source), the anchor mismatches and the gate BLOCKS.

