    on_by_default: YES          # default turn behavior; no flag; lesion-verified in the production lesion probe
    scaffold_retired: NO        # the host QuestionRouter remains the FALLBACK (role-blind) — retired only when #1 (spiking selector) lands
    host_scaffold_in_default: "host QuestionRouter is still the fallback recall; the fuller LEARN (a BTSP/plasticity per-turn write for a LASTING trace) is the next depth"
    evidence: "brain_chat_tui.py _maybe_acquire + gate() substrate-first + _substrate_recall; rf_phasor_composer.py runtime code allocation (_filler_phases + _growth_rng); probe LEARN True + lesion-load-bearing; finding 2026-08-12-INTEGRATION2 + 2b addendum"

