# PRODUCTION-INTEGRATION LEDGER — the honest state of the DEFAULT /api/brain-chat turn.
#
# THE GOAL (owner, 2026-08-11): a working all-spiking one-substrate brain with ALL faculties ON BY DEFAULT in
# production, fully functional when chatted with. A faculty is DONE only when WIRED + ON-BY-DEFAULT + SCAFFOLD-RETIRED.
# This file is the tracked truth; tools/gates/production_integration.py (CLASS PI) cross-checks every row's levels
# against live source (anchors) and blocks any doc that CLAIMS a faculty is integrated/wired/on-by-default/one-brain
# beyond what its row supports. Seeded 2026-08-11 from workflow wjgvtko3i (12-agent code-trace, adversarially checked).
#
# LEVELS (each a verified value: YES / PARTIAL / NO):
#   de_risked        validated GO at runner/de-risk level (6-seed etc.)
#   wired            reachable from webapp/server.py /api/brain-chat -> the ChatBrain it builds (not only a runner)
#   on_by_default    runs in the DEFAULT config the owner gets (no opt-in flag, not default-off, not behind rich=True)
#   scaffold_retired the host shortcut it replaces is GONE from the default path (deleted / demoted to test-oracle)
# A row is INTEGRATED only when wired=YES AND on_by_default=YES AND scaffold_retired=YES.
#
# ANCHORS (the machine-checkable part). default_anchor: the gate reads the RHS literal at `assign` and derives the
# expected value FROM the on_by_default LEVEL (NO => must be off_value; YES => must be on_value). scaffold_symbol: while
# scaffold_retired=NO the host symbol MUST be present; =YES it must be absent. If source flips without the ledger moving
# (or the ledger flips without the source), the anchor mismatches and the gate BLOCKS.

headline:
  # THE PRIMARY NORTH-STAR — OWNER-VISIBLE FUNCTION (the 3 acts trace-stamping cannot fake; each needs a LESION test:
  # disable the spiking path -> the default answer must CHANGE, else it is not genuinely doing the act).
  owner_visible_function:
    # EMPIRICALLY MEASURED by running the real default brain: research/runners/_production_lesion_probe.py ->
    # research/findings/raw/_production_lesion/probe.json. A wiring earns credit only when it flips one of these to True
    # on THIS probe AND the lesion of its path flips it back off (load-bearing, not cosmetic).
    choose: PARTIAL  # 2026-08-12 INTEGRATION #1: direct factual questions are decided by the SUBSTRATE (recall or honest
                     # abstain), lesion-verified; the host router's keyword-CONFAB is retired for them. Residual: neural
                     # question comprehension + open-ended topic choice; host still handles self/identity + noisy-anaphora.
    generate: PARTIAL # 2026-08-12 UPGRADED: open-ended NOVEL-proposition generation (#3E) is now WIRED onto the DEFAULT
                     # gate()/render() — an explicit open-ended prompt ("what might X ...", "guess ...") returns a FLAGGED
                     # "perhaps a v p" hypothesis (novel + plausibility-gated over the brain's own fact-graph + moat-verified),
                     # prompt-triggered, on the default turn (no rich toggle). The RICH path (RichAnswerComposer, spiking
                     # elaborate + neural_planner=True) also remains for associative multi-fact replies. RESIDUAL host shortcut:
                     # the generative DRAW is the b2 host oracle (the spiking WTA sampler hardcodes the taxonomy) -> PARTIAL,
                     # not full spiking. See the open-ended-generation row. (The DEFAULT recall path stays byte-identical.)
    learn: YES       # 2026-08-12 INTEGRATION #2 + fix: acquisition moved INTO gate() (an SVO assertion is taught + returned),
                     # so it reaches the /api/brain-chat endpoint; substrate-first recall. Production-path probe (gate+render):
                     # teach "wolf hunt deer" -> recall "wolf hunt deer", lesion-verified. Runtime code allocation for new words.
  # SECONDARY — the composite. default_on_spiking = rows at on_by_default=YES whose spiking path is lesion-load-bearing.
  default_on_spiking_faculties: 10     # RF phasor bind/unbind resonate dynamics; the anaphora referent store; the co-resident graded-affect ladder (Gate-B); the co-resident comprehension monitor (Gate-B/D4); the co-resident surprise/mismatch unit (Gate-B/D2); the co-resident balance-of-evidence metacog monitor (Gate-B/E1); the co-resident affective world-model (Gate-B/E2); the co-resident curiosity ASK-pool crave drive (Gate-B/D3); the co-resident multi-referent WM bump-attractor buffer (Gate-B/D6); the co-resident hippocampal dAP episodic recall gate (Gate-B/D5) — all lesion-load-bearing. (The B3 non-contradiction ASSERTION-gate + the B4 reconsolidation belief-revision are ALSO default-on faculties but reuse EXISTING spiking reads — the ONE production recall composer's ask_yes_no polarity WTA, and the D2 surprise window respectively — so they add no NEW spiking substrate.)
  scaffold_retired: 0
  total_faculties: 22
  note: "most of the live chat's load-bearing cognition is still host/numpy/off-bridge; the spiking set now includes the affect ladder (Gate-B colors WHAT+HOW), the comprehension monitor (Gate-B/D4, honest 'I didn't follow that' abstain), the expectation-violation/surprise unit (Gate-B/D2, honest 'that surprises me' notice), the balance-of-evidence metacog monitor (Gate-B/E1, honest 'low-confidence' hedge), the affective world-model (Gate-B/E2, queryable 'what do you expect' + honest 'that shifts the mood unexpectedly' notice), the curiosity ASK-pool crave drive (Gate-B/D3, honest follow-up QUESTION on a novel-topic abstain — crave, don't refuse), the multi-referent WM buffer (Gate-B/D6, HOLD >=2 discourse referents + honest 'I'm holding 2: dog and cat' read-out), and the hippocampal dAP episodic recall gate (Gate-B/D5, honest 'I recall / I don't recall discussing X' on a referential turn) — all lesion-load-bearing co-resident reads. The non-contradiction ASSERTION-gate (Gate-B/B3, REJECT a contradiction of a held belief) + reconsolidation (Gate-B/B4, PE-gated IN-PLACE belief revision) reuse the existing spiking recall composer / D2 window. Appraisal-injection + the Qwen manner-mouth + the comprehension cue-lexicon + the surprise operating-point proxy + the metacog evidence-derivation + the world-model generic-valence pools/persistence-selection + the curiosity SELECTOR/VETO + the D6 host referent-parse/write-marker/argmax-read + the D5 host content/recency + the B3 host negation-detection/morphology remain declared scaffolds; the D5 BTSP WRITE is deferred on numpy (cupy-gated)."

