# Single source of truth for the DEFAULT mini-PC pool node list.
# Read by tools/pool_nodes.sh (shell) and tools/pool_nodes.py (Python) -- every tools/pool_*.sh /
# ratchet.py / parallel_audit.py / pool_health.py / workflow_check.sh script sources its default node
# list from here instead of hard-coding it. Callers' own precedence is unchanged: an explicit POOL_NODES
# env var or explicit CLI node arguments still win over this default, and research/queue/.pool_extra_nodes
# (AWS/extra nodes) is still appended on top of it wherever it already was.
#
# Format: hostnames separated by whitespace and/or newlines. '#' starts a comment; blank lines ignored.
#
# To ADD a node: append its hostname below (it must resolve the same way pool41/pool42 do -- either a
# plain LAN hostname or a Host alias in research/queue/.pool_ssh_config).
# To RETIRE a node: remove its hostname below. (pool40 retired indefinitely 2026-09-30 -- owner: needs an
# OS reinstall, no plans to bring it back. See git history of this file / research/FAILURE_LOG.md for why.)
# 2026-10-02: pool40 reinstalled (Ubuntu 22.04.5) and back; wspool = the owner's workstation as a restricted
# node (user simpool, 14 CPUs, 20 GB slice). wspool answers exit 75 (busy) while the owner games. Neither has an
# unpinned ~/derisk-pool/sim checkout, so every pool line must be pinned to a provisioned revision.
pool40 pool41 pool42 wspool
