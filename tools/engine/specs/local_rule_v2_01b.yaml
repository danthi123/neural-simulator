# Local rule v2 at 01b, brain/research/2026-11-27-local-rule-v2-prereg.md (DRAFT pending pre-data review). Harness:
# brain/experiments/local_rule_v2.py (imported, not edited); same units, arms, dev grid and pick as
# results/2026-11-27-local-rule-v2/run_node.sh. dev = seed 7: ref (no_sleep, gradient) + 9 v2 configs (lr x tau), one job
# each; pick = local_rule_v2.dev_pick (NEGATIVE-DEV: no six seeds for this model); six = the six arms at the pick.
# Order (prereg Run line): 01b dev -> 01b six -> 04b dev -> 04b six; "NEGATIVE-DEV for that model" does not stop the other
# scale, so 01b chains to 04b on every verdict except ERROR (one question, max_len 2). Fresh seeds: no placement.
# The out-dir is per commit and per job (dev grid key or s<seed>): a retried attempt resumes its finished units.
name: local_rule_v2_01b
question: "Does the local delta rule with plasticity confined off the keep-bank subspace pass the v2 rule (0.1B then 0.4B)?"
prereg: brain/research/2026-11-27-local-rule-v2-prereg.md
requires_local: [brain/research/2026-11-27-local-rule-v2-prereg.md]
status: DRAFT                     # -> REGISTERED once the pre-data review is recorded in the prereg
module: local_rule_v2.py
pick: pick
verdict: verdict
model: rwkv7-g1d-0.1b-20260129-ctx8192.pth
cmd: >-
  D=$HOME/brain-lane/engine/data/local_rule_v2_01b/{commit}/{job}; mkdir -p $D &&
  "$PY" -u -m brain.experiments.local_rule_v2 run --model {model} --seed {seed} --device {device} {params} --out-dir $D
  > $D/run.log 2>&1 && "$PY" -m tools.engine.bundle $D {out} --glob '*.json'
dev_seed: 7
dev_grid:
  ref: "--arms no_sleep,gradient --tag ref"
  lr0.1_tau0.9: "--arms v2 --lr 0.1 --tau 0.9 --tag lr0.1_tau0.9"
  lr0.1_tau0.99: "--arms v2 --lr 0.1 --tau 0.99 --tag lr0.1_tau0.99"
  lr0.1_tau0.999: "--arms v2 --lr 0.1 --tau 0.999 --tag lr0.1_tau0.999"
  lr0.3_tau0.9: "--arms v2 --lr 0.3 --tau 0.9 --tag lr0.3_tau0.9"
  lr0.3_tau0.99: "--arms v2 --lr 0.3 --tau 0.99 --tag lr0.3_tau0.99"
  lr0.3_tau0.999: "--arms v2 --lr 0.3 --tau 0.999 --tag lr0.3_tau0.999"
  lr1.0_tau0.9: "--arms v2 --lr 1.0 --tau 0.9 --tag lr1.0_tau0.9"
  lr1.0_tau0.99: "--arms v2 --lr 1.0 --tau 0.99 --tag lr1.0_tau0.99"
  lr1.0_tau0.999: "--arms v2 --lr 1.0 --tau 0.999 --tag lr1.0_tau0.999"
seeds: [42, 43, 44, 100, 101, 102]
memory_gb: 8                      # the prereg's memcap at 01b
requires: [brain-lane/models/rwkv7-g1d-0.1b-20260129-ctx8192.pth]
ladder: {max_len: 2, next: {GO: local_rule_v2_04b, NEGATIVE: local_rule_v2_04b, UNDEFINED: local_rule_v2_04b}}
