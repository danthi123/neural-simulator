# tools/agent_container/compose.yaml -- the isolated local-model harness, homelab-server (192.168.0.10).
# Isolation IS the point (docs/plans/2026-09-29-local-model-transition-PLAN.md section 9): this box also runs
# gitea, nextcloud, home assistant and other unrelated services, so sim-agent gets its own network, no docker
# socket, a dropped capability set, no host access, and a read-only root filesystem.
#
#   cd ~/sim-agent && docker compose -f compose.yaml build
#   docker compose -f compose.yaml up -d
#   docker compose -f compose.yaml run --rm sim-agent <smoke-test-command>      # see smoke_test.sh
name: sim-agent

services:
  sim-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # UID/GID 61000, not 1000 (2026-09-29 security review, LOW): 1000 maps to the WORKSTATION account's own
        # UID (dant123) -- any escape that reached raw filesystem access (e.g. a mis-scoped bind mount, or a
        # future volume-driver bug) would land with the SAME uid as the real user. An unused, deliberately
        # high/unusual id has no such collision on this box. Volume ownership needs no `chown` under
        # `cap_drop: ALL` (which drops CAP_CHOWN too): Docker copies a NAMED VOLUME's mount-point content --
        # including ownership -- from the IMAGE's own directory the FIRST time it is mounted over one, and the
        # Dockerfile already `chown`s /work/sim (build time, unrestricted) and creates /home/agent as this uid
        # via `useradd -m` -- so both volumes come up correctly owned on first start with no runtime chown at
        # all. See docs/AGENT_HARNESS_SETUP.md for the doc fix this replaces (its old `docker exec -u root ...
        # chown` step could never have worked under this same cap_drop).
        AGENT_UID: "61000"
        AGENT_GID: "61000"
    image: sim-agent:latest
    container_name: sim-agent
    hostname: sim-agent
    # No `init: true` here -- the Dockerfile's own ENTRYPOINT already runs tini as PID 1 (wrapping
    # entrypoint.sh); compose's `init: true` would ALSO inject docker's built-in init ahead of it, which then
    # stops tini from acting as PID 1/child-subreaper (observed live 2026-09-29: tini's own warning under
    # `docker compose run`). One init, at the image level, is enough.
    restart: unless-stopped

    # --- isolation -------------------------------------------------------------------------------------------
    networks:
      - agent-net                      # its OWN bridge network only -- never `network_mode: host`, never
                                        # attached to any other stack's network (gitea/nextcloud/etc.)
    # No `ports:` -- nothing is published. The container reaches the workstation by making an OUTBOUND ssh
    # connection (its restricted gateway key); nothing on the server or the LAN connects INTO sim-agent.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true                    # root filesystem is read-only; every writable path below is explicit
    tmpfs:
      - /tmp:size=2g,mode=1777          # Claude Code + tmux + pip/venv scratch space; wiped on every recreate
    ulimits:
      nproc: 4096
    # Plain (non-swarm) resource limits -- `deploy.resources.limits` is a Swarm-stack construct that modern
    # `docker compose` (v5 here) refuses to mix with the non-swarm `pids_limit` below ("can't set distinct
    # values on 'pids_limit' and 'deploy.resources.limits.pids'"), so cpus/memory use the equivalent plain
    # Compose fields instead -- same effect for `docker compose up`, no Swarm involved either way.
    cpus: "12"
    mem_limit: "24g"
    pids_limit: 4096

    # --- bounded logs (2026-09-29 security review, M3) -------------------------------------------------------
    # The default json-file driver has NO size cap -- an agent-authored job that logs heavily (or loops) could
    # fill this SHARED server's disk with nothing but this one container's stdout/stderr. `local` (Docker's own
    # size-bounded driver, no extra daemon config needed) caps it explicitly; see update.sh's own disk-usage
    # check for the volumes (which this logging driver does not cover -- named volumes have no such built-in cap).
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

    # --- persistence: exactly two named volumes, nothing else writable --------------------------------------
    volumes:
      - sim-agent-repo:/work/sim
      - sim-agent-home:/home/agent

    environment:
      - AGENT_HOME=/home/agent
      - REPO_DIR=/work/sim
      # Cloud-profile secrets (tools/agent_container/profiles/*.env's TOKEN_VAR) are supplied here or via
      # env_file, NEVER written into a profile file or baked into the image. Example (commented):
      # - CLOUD_LLM_API_KEY=${CLOUD_LLM_API_KEY:?set in .env, not in this file}

networks:
  agent-net:
    driver: bridge
    # NO IPv6 (2026-09-29 re-review, LOW): tools/agent_container/egress.sh only writes IPv4 iptables rules --
    # an ip6tables ruleset would have to be built and kept in exact sync with it to close the same gaps for v6
    # traffic. Simpler and strictly stronger: give the bridge no IPv6 capability at all, so there is no v6
    # traffic for a missing ip6tables rule to ever leave ungoverned in the first place.
    enable_ipv6: false
    ipam:
      config:
        # FIXED SUBNET (2026-09-29 security review, M1): tools/agent_container/egress.sh's iptables DOCKER-USER
        # rules target this subnet directly -- a Docker-assigned one (the previous default) can change on a
        # network recreate, silently leaving the firewall rules matching nothing. Keep this in sync with
        # egress.sh's SIM_AGENT_EGRESS_SUBNET default if it is ever changed here.
        - subnet: 172.30.30.0/24

volumes:
  sim-agent-repo:
  sim-agent-home:
