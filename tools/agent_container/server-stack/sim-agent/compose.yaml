# sim-agent — isolated local-model agent harness for the neural-simulator repo. No web UI, no Caddy route.
# SOURCE OF TRUTH: neural-simulator repo, tools/agent_container/server-stack/sim-agent/compose.yaml. This file is
# a verbatim copy in ~/apps/sim-agent/ (update.sh warns when the two drift). Owner procedure and threat model:
# docs/AGENT_HARNESS_SETUP.md in that repo.
#
# The model driving this container may be ADVERSARIAL, so it is isolated beyond this box's usual stack:
#   - its OWN bridge (fixed name br-simagent, fixed subnet 172.30.30.0/24, outside the 172.20/16 pool), never
#     `proxy`, no published ports. /etc/nftables.d/sim-agent.nft (sim-agent-fw.service) matches that name and
#     subnet: no host listener is reachable, egress is DNS + the workstation gateway/model port + gitea ssh +
#     HTTPS to the public internet only (not this site's own WAN address).
#   - non-root UID 61000, cap_drop ALL, no-new-privileges, read-only root, noexec /tmp, no docker socket,
#     CPU/memory/pid limits, OOM-killed before other services (oom_score_adj).
#   - state on the ZFS dataset data/appdata/sim-agent (refquota-capped, sanoid-snapshotted). backup.sh SKIPs
#     this stack on purpose: a nightly cold stop would kill live agent sessions.
#
#   cd ~/apps && docker compose build sim-agent        # LOCAL build -- `compose pull` cannot fetch it
#   cd ~/apps && docker compose run --rm --no-deps sim-agent smoke_test.sh
#   cd ~/apps && docker compose up -d sim-agent        # only while sim-agent-fw.service is active
# Weekly rebuild/smoke/rollback: ${DATA_ROOT}/sim-agent/src/tools/agent_container/update.sh.
services:
  sim-agent:
    # LOCAL BUILD from the owner's read-only-to-the-agent source checkout on the dataset (like privdna /
    # genomeprivate / proxchat). The ONE Dockerfile is the repo's tools/agent_container/Dockerfile; src/ is a
    # clone of the GitHub remote, which the container holds no credential for, so the agent can never edit what
    # it is built from. Never point this at .../repo (the agent's own writable checkout).
    # Not enrolled in Dockhand auto-update (local build; enrollment is per container name, so absence = held).
    build:
      context: ${DATA_ROOT}/sim-agent/src/tools/agent_container
      dockerfile: Dockerfile
      args:
        # UID/GID 61000, not 1000: 1000 is the workstation account's uid; an escape would land as that user.
        AGENT_UID: "61000"
        AGENT_GID: "61000"
    image: sim-agent:local             # docker.io/library/* cannot be squatted, so a pull attempt can only fail
    pull_policy: missing               # same fields as caddy's local build: use the local image, build if absent
    container_name: sim-agent
    hostname: sim-agent
    # No `init: true`: the image's ENTRYPOINT already runs tini as PID 1; a second init stops tini subreaping.
    restart: unless-stopped
    # No healthcheck on purpose: a restart-on-unhealthy tool would kill a live agent session for a missing tmux.
    labels:                            # Homepage tile = container status only; no href, no widget, no secret
      homepage.group: Infrastructure
      homepage.name: sim-agent
      homepage.description: Isolated local-model agent harness (no web UI)
      homepage.icon: mdi-robot-outline

    # --- isolation ---------------------------------------------------------------------------------------
    networks:
      - sim-agent-net                  # its OWN bridge only; never `proxy`, never network_mode: host
    # No `ports:` -- nothing is published; the container only makes outbound connections.
    # DNS pinned to the exact resolvers sim-agent.nft allows (Docker's embedded DNS at 127.0.0.11 forwards to
    # these from the container's netns). Pinned so a host resolver change can't silently break or widen it.
    dns:
      - 192.168.0.1
      - 1.1.1.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true                    # every writable path is explicit below
    tmpfs:
      # noexec,nosuid,nodev: nothing legitimate executes from /tmp (tmux keeps only its socket there).
      - /tmp:size=2g,mode=1777,noexec,nosuid,nodev
    ulimits:
      nproc: 4096
    # Sized for this host (16 cores, 61 GB RAM, ~23 GB available on 2026-09-30) so the agent can never starve
    # the other stacks: at most half the cores, 12 GB, no swap beyond that, and it is the kernel's first OOM
    # victim if the host itself runs short. Plain (non-swarm) fields -- `deploy.resources` conflicts with
    # pids_limit under docker compose v5.
    cpus: "8"
    mem_limit: "12g"
    memswap_limit: "12g"
    pids_limit: 4096
    oom_score_adj: 500

    logging:                           # bounded (site convention); agent-authored jobs can't fill the disk
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    # --- persistence: exactly two bind mounts on the ZFS dataset, nothing else writable ---------------------
    # Long syntax with create_host_path: false -- if the dataset is not mounted, the container FAILS to start
    # instead of Docker silently creating root-owned dirs on the root filesystem outside the quota.
    volumes:
      - type: bind
        source: ${DATA_ROOT}/sim-agent/repo
        target: /work/sim
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/sim-agent/home
        target: /home/agent
        bind: { create_host_path: false }

    environment:
      TZ: ${TZ}
      AGENT_HOME: /home/agent
      REPO_DIR: /work/sim
      # Fail closed (tools/agent_container/bin/firewall_guard.sh, run by entrypoint.sh): refuse to start unless a
      # probe of this host's sshd through the bridge gateway is DROPPED, i.e. sim-agent.nft is loaded.
      SIM_AGENT_REQUIRE_FIREWALL: "1"
      SIM_AGENT_FW_PROBE: "172.30.30.1:22"
      # Cloud-profile keys (tools/agent_container/profiles/{deepseek-flash,glm-lite}.env TOKEN_VAR) come from
      # SIM_AGENT_* entries in ~/apps/.env (0600, gitignored). `:-` on purpose: this fragment is part of the ONE
      # ~/apps project, so a `:?` here would break `docker compose` for every stack whenever the key is unset.
      # Unset -> empty -> `llm use <cloud profile>` refuses cleanly. Never env_file: the root .env (that would
      # hand this container every other stack's secrets).
      DEEPSEEK_API_KEY: ${SIM_AGENT_DEEPSEEK_API_KEY:-}
      GLM_API_KEY: ${SIM_AGENT_GLM_API_KEY:-}

networks:
  sim-agent-net:                       # compose names it apps_sim-agent-net (project `apps`)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-simagent   # FIXED interface name (<=15 chars) that sim-agent.nft matches
    enable_ipv6: false                 # no v6 at all (sim-agent.nft also drops any v6 from this bridge)
    ipam:
      config:
        # FIXED subnet outside default-address-pools (172.20.0.0/16), so Docker never hands it to another stack.
        # Keep in sync with sim-agent.nft's SIM_NET and SIM_AGENT_FW_PROBE above (tests pin all three).
        - subnet: 172.30.30.0/24
          gateway: 172.30.30.1
