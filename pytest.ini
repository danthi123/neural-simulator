[pytest]
# testpaths = tests (2026-09-29 security re-review, M1): restricts collection to tests/ ONLY. Without this, a
# bare `pytest` run from the repo root walks the WHOLE tree looking for conftest.py files to import (pytest's
# own collection semantics: a conftest.py is imported based on directory structure, independent of whether that
# directory has any test files) -- and an agent-authored GPU/pool job can legitimately write into its own
# writable output subdirectory, research/findings/raw/_agent_jobs/<job-id>/. A conftest.py planted there would
# be imported (arbitrary code execution) the next time anyone -- the owner, CI -- runs a bare `pytest` from the
# repo root. Restricting collection to tests/ means pytest never even looks under research/ at all.
testpaths = tests
