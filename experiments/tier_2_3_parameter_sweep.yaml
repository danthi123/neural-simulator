name: tier-2-3-parameter-sweep
runner: research.runners.phrase_trainer
output_dir: research/findings/raw/g11_bg
parallelism: 2

# Tier 2.3 parameter sweep -- activates IF 6-seed shows phrase
# accuracy stuck at 30-45% (architecture works but composition
# inconsistent across directions).
#
# Hypotheses (per Tier 2.3 design Sec 7):
#
# H1: action_gate drive_pA mistuned. Default 50pA may be either
#     too weak (motor teacher 300pA dominates) or too strong
#     (action_gate distorts motor selection). Test 0 (disable),
#     10 (weak), 100 (strong).
#
# H2: verb_drive_ms too short. Default 100ms may not establish
#     PFC NMDA bistability. Try 200ms.
#
# H3: STDP at lang -> dlpfc_verb under-trained. Default 200 phrase
#     events. Try 400 (doubled) for more verb-binding.
#
# 5 conditions x 3 seeds = 15 runs at parallel=2 ~ 7-8 batches
# x 35min = ~4 hours. If this is too long, drop to 3-condition
# minimum: H1_off, H1_strong, H3_double.

seeds: [42, 43, 44]  # 3 seeds per condition (compute budget)

base_args:
  n-phrase-events: 200
  n-direction-only-events: 100
  n-verb-only-events: 30
  n-lang-input: 2048
  n-motor-per-action: 500
  n-motor-fs-per-action: 60
  n-dlpfc-verb: 200
  n-test-per-direction: 25
  n-verb-only-test: 25

conditions:
  # Baseline (matches main 6-seed validation; should give ~40%)
  - name: baseline
    args: {}
  # H1a: action_gate disabled (drive_pA=0). Tests whether action_gate
  # is HURTING phrase composition. If phrase >= direction-only acc,
  # action_gate is the issue.
  - name: gate_off
    args:
      action-gate-drive-pA: 0.0
  # H1b: action_gate weak (10pA). Tests whether smaller boost helps.
  - name: gate_weak
    args:
      action-gate-drive-pA: 10.0
  # H1c: action_gate strong (100pA). Tests whether stronger boost
  # makes verb context dominant enough.
  - name: gate_strong
    args:
      action-gate-drive-pA: 100.0
  # H2: longer verb drive for PFC NMDA bistability
  - name: verb_long
    args:
      verb-drive-ms: 200
  # H3: more phrase events for STDP (doubled)
  - name: events_double
    args:
      n-phrase-events: 400

out_stats_template: "phrase_sweep_{name}_seed{seed}.json"
out_arg_name: "out-stats"
