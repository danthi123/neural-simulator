name: tier-2-3-parameter-sweep
runner: research.runners.phrase_trainer
output_dir: research/findings/raw/g11_bg
parallelism: 2

# Tier 2.3 parameter sweep -- activates IF 6-seed shows phrase
# accuracy stuck at 30-45% (architecture works but composition
# doesn't generalize across all 4 directions).
#
# Tests three hypotheses for why phrase composition fails:
#
# H1: action_gate drive_pA too weak. Default 50pA may be too small
#     vs 300pA motor teacher. Try 100pA and 200pA.
#
# H2: verb_drive_ms too short. Default 100ms may not establish PFC
#     NMDA bistability. Try 200ms.
#
# H3: STDP at lang -> dlpfc_verb under-trained. Default 200 phrase
#     events. Try 400 (doubled) to see if more verb-binding helps.
#
# Each condition tests one hypothesis. If any condition shows >= 50%
# phrase accuracy at >= 4/6 seeds, that's the fix.

seeds: [42, 43, 44]  # 3 seeds per condition (compute budget)

base_args:
  n-direction-only-events: 100
  n-verb-only-events: 30
  n-lang-input: 2048
  n-motor-per-action: 500
  n-motor-fs-per-action: 60
  n-dlpfc-verb: 200
  n-test-per-direction: 25
  n-verb-only-test: 25

conditions:
  # H1: stronger action_gate drive (would need code change to expose
  # via CLI -- defer if needed)
  # NOTE: action_gate drive_pA is currently a python-level kwarg
  # in build_tier_2_3_action_gate(). To sweep it we'd need to expose
  # via CLI flag. For now this YAML focuses on H2 + H3 which are
  # already CLI-exposed.
  - name: phrase_baseline
    args:
      n-phrase-events: 200
      # default verb_drive_ms=100, default action_gate drive_pA=50
  - name: phrase_double_events
    args:
      n-phrase-events: 400  # H3: more STDP per phrase
  - name: phrase_short
    args:
      n-phrase-events: 100  # check whether shorter helps (sometimes
                             # less interference)

out_stats_template: "phrase_sweep_{name}_seed{seed}.json"
out_arg_name: "out-stats"
