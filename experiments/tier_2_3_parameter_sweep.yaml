name: tier-2-3-parameter-sweep
runner: research.runners.phrase_trainer
output_dir: research/findings/raw/g11_bg
parallelism: 2

# Tier 2.3 parameter sweep (focused 2-condition version).
#
# 6-seed validation showed mean phrase 39.8% (+/- 4.6%), 0/6 at
# 50% threshold. Tight variance suggests systematic issue, not
# seed-variance. Per design Sec 7, two most-informative tests:
#
# H1: action_gate is hurting (drive_pA=0 disables it). If phrase
#     accuracy then matches direction-only (~42%), action_gate
#     mechanism IS the issue and needs replacing (per design
#     options B/C: inhibitory pathway or striatum modulation).
#
# H2: more phrase events for STDP (n=400 doubled). If phrase
#     reaches 50%+ with more training, STDP at
#     language_input -> dlpfc_verb is under-trained, not
#     mechanism issue.
#
# Baseline already in main 6-seed; reuse those results for compare.
#
# 2 conditions x 3 seeds = 6 runs at parallel=2 ~ 1h 15min.

seeds: [42, 43, 44]

base_args:
  n-direction-only-events: 100
  n-verb-only-events: 30
  n-lang-input: 2048
  n-motor-per-action: 500
  n-motor-fs-per-action: 60
  n-dlpfc-verb: 200
  n-test-per-direction: 25
  n-verb-only-test: 25

conditions:
  # H1: action_gate disabled (drive_pA=0)
  - name: gate_off
    args:
      n-phrase-events: 200
      action-gate-drive-pA: 0.0
  # H2: more STDP events (doubled)
  - name: events_double
    args:
      n-phrase-events: 400

out_stats_template: "phrase_sweep_{name}_seed{seed}.json"
out_arg_name: "out-stats"
