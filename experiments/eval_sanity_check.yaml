# Eval sanity check — B-branch fallback if biology_sweep gives 0/6 across all
# conditions. Hand-builds PERFECT language_input -> motor_X weights, runs the
# same evaluation methodology used in the entire text-IO investigation,
# and reports aligned ratio.
#
# Outcome interpretations:
#   aligned >= 4/6: eval methodology is SOUND. The 0/6 streak in real
#     experiments is driven by plasticity inadequacy (STDP can't find
#     this weight pattern under noisy paired-stim training).
#
#   aligned 0-1/6: eval methodology is BROKEN. Hand-built perfect
#     weights cannot be detected by the eval — we've been chasing
#     a phantom signal across 25+ runs. Investigate drive currents,
#     motor pool dynamics, baseline subtraction.
#
# Note: this YAML is auto-launched by wait_biology_then_decide.ps1
# under verdict B. Can also be run manually:
#   python -m research.experiment_runner experiments/eval_sanity_check.yaml
#
# Single-seed quick-test:
#   python -m research.runners.eval_sanity_check --seed 42

name: eval-sanity-check
runner: research.runners.eval_sanity_check
output_dir: research/findings/raw/g11_bg
parallelism: 3

# 6 seeds tests robustness to random init of the lang_input -> motor_X
# random connectivity (each seed has different edge structure; we wipe
# and reset only existing edges, so different seeds test different
# "effective densities").
seeds: [42, 43, 44, 100, 101, 102]

base_args:
  n-lang-input: 256
  n-motor-per-action: 25
  token-sparsity: 0.1
  target-weight: 8.0
  n-eval-per-word: 25
  stim-steps-per-step: 100
  reset-steps: 50
  dt-ms: 1.0

conditions:
  # Default minimal-arch density (0.30) — most realistic test that
  # matches what would be used in an actual successful run.
  - name: density030
    args:
      text-input-to-motor-density: 0.30

  # Full connectivity (1.0) — eliminates "did random init create the
  # right edges" as a confound. PURE eval-logic test.
  - name: density100
    args:
      text-input-to-motor-density: 1.0

out_stats_template: "text_eval_sanity_check_{name}_seed{seed}.json"
