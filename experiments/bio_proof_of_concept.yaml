# Biological-scale STDP training, multi-seed validation (Option B).
#
# CONDITIONAL on bio_sanity_check passing. Now running 6 seeds x 2
# conditions = 12 runs at parallel=3 to use ~7.2 GB / 24 GB VRAM
# (2.4 GB/run × 3 simultaneous). This validates findings beyond
# single-seed luck.
#
# Memory budget at parallel=3:
#   - Per-run: ~2.4 GB GPU peak (verified empirically by user)
#   - 3 parallel runs: ~7.2 GB GPU peak
#   - Comfortable in 24 GB; ~17 GB headroom for system overhead
#
# Estimated runtime per run: ~70-90 min (4000 events at biological
# scale, ~24ms/substep × 170 substeps/event × 4000 events = ~16K sec).
# Total at parallel=3: 4 batches × ~70 min = ~5 hours.
#
# Expected outcomes (multi-seed):
#   - bio_baseline aligned >= 4/6: cortical canon ALONE enables W->A
#     learning. Strong scientific finding.
#   - bio_topo_fs aligned >= 4/6: biology fix matters at bio scale.
#   - Both 0-2/6: plasticity rule itself is the bottleneck. The
#     post-chain logic auto-launches B3 (supervised gradient) at
#     bio scale to test if ANY learning rule succeeds here.
#
# Follow-up auto-fires via launch_bio_chain.ps1 after this completes.

name: bio-proof-of-concept
runner: research.runners.text_minimal_isolation
output_dir: research/findings/raw/g11_bg
parallelism: 3

# Multi-seed validation: 6 seeds matches the rest of this project's
# convention (3 "near" seeds + 3 "far" seeds spanning hash space).
seeds: [42, 43, 44, 100, 101, 102]

base_args:
  biological: true             # cortical canon + auto-bumped sizes
  n-events-per-direction: 1000  # matches biology sweep training dose
  stim-steps-per-step: 100
  reset-steps: 50
  dt-ms: 1.0
  n-eval-word-action: 25

conditions:
  # Cortical canon alone (recurrence + E/I + NMDA), no biology fix.
  # Tests "does cortical canon ALONE enable W->A learning?"
  - name: bio_baseline
    args: {}

  # Cortical canon + Pulvermuller topographic prior + Vogels motor PV-FSI.
  # Tests "is biology fix additive on canon?"
  - name: bio_topo_fs
    args:
      enable-motor-fs: true
      topographic-bias-factor: 1.5
      off-target-bias-factor: 0.7

out_stats_template: "text_eval_bio_{name}_seed{seed}.json"
